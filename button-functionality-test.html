<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px; }
        .test-result { margin: 5px 0; padding: 8px; border-radius: 4px; }
        .success { background: #4CAF50; }
        .error { background: #f44336; }
        .warning { background: #ff9800; }
        .info { background: #2196F3; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        h2 { color: #4CAF50; }
        .summary { background: rgba(76, 175, 80, 0.1); border: 1px solid #4CAF50; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔘 Button Functionality Comprehensive Test</h1>
    <p>This test verifies all button handlers across the entire application.</p>
    
    <div class="test-section">
        <h2>Menu Buttons Test</h2>
        <button onclick="testMenuButtons()">Test Menu Buttons</button>
        <div id="menu-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Prayer Network Buttons Test</h2>
        <button onclick="testPrayerNetworkButtons()">Test Prayer Network Buttons</button>
        <div id="prayer-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Main Game Buttons Test</h2>
        <button onclick="testMainGameButtons()">Test Main Game Buttons</button>
        <div id="game-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Authentication Buttons Test</h2>
        <button onclick="testAuthButtons()">Test Authentication Buttons</button>
        <div id="auth-results"></div>
    </div>
    
    <div class="summary" id="summary">
        <h2>📋 Test Summary</h2>
        <div id="summary-content">Run the tests above to see results.</div>
    </div>

    <script>
        function log(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
            updateSummary();
        }

        let testResults = {
            menu: { passed: 0, failed: 0 },
            prayer: { passed: 0, failed: 0 },
            game: { passed: 0, failed: 0 },
            auth: { passed: 0, failed: 0 }
        };

        function updateSummary() {
            const total = Object.values(testResults).reduce((sum, cat) => sum + cat.passed + cat.failed, 0);
            const passed = Object.values(testResults).reduce((sum, cat) => sum + cat.passed, 0);
            const failed = Object.values(testResults).reduce((sum, cat) => sum + cat.failed, 0);
            
            document.getElementById('summary-content').innerHTML = `
                <p><strong>Total Tests:</strong> ${total}</p>
                <p><strong>✅ Passed:</strong> ${passed}</p>
                <p><strong>❌ Failed:</strong> ${failed}</p>
                <p><strong>Success Rate:</strong> ${total > 0 ? Math.round((passed / total) * 100) : 0}%</p>
            `;
        }

        async function testMenuButtons() {
            log('menu-results', '🔍 Testing Menu Buttons...', 'info');
            
            try {
                // Check if menu.html exists and has button functions
                const response = await fetch('menu.html');
                if (!response.ok) throw new Error('menu.html not found');
                const html = await response.text();
                
                // Check critical functions
                const functions = ['enterGame', 'openAcademy', 'openPrayerNetwork'];
                functions.forEach(func => {
                    if (html.includes(`function ${func}()`)) {
                        log('menu-results', `✅ ${func}() function found`, 'success');
                        testResults.menu.passed++;
                    } else {
                        log('menu-results', `❌ ${func}() function missing`, 'error');
                        testResults.menu.failed++;
                    }
                });
                
                // Check authentication buttons
                if (html.includes('id="google-signin-btn"')) {
                    log('menu-results', '✅ Google sign-in button exists', 'success');
                    testResults.menu.passed++;
                } else {
                    log('menu-results', '❌ Google sign-in button missing', 'error');
                    testResults.menu.failed++;
                }
                
                if (html.includes('id="google-signout-btn"')) {
                    log('menu-results', '✅ Google sign-out button exists', 'success');
                    testResults.menu.passed++;
                } else {
                    log('menu-results', '❌ Google sign-out button missing', 'error');
                    testResults.menu.failed++;
                }
                
                // Check event listeners
                if (html.includes('addEventListener(\'click\'')) {
                    log('menu-results', '✅ Event listeners attached', 'success');
                    testResults.menu.passed++;
                } else {
                    log('menu-results', '⚠️ Event listeners not found', 'warning');
                    testResults.menu.failed++;
                }
                
            } catch (error) {
                log('menu-results', `❌ Menu test failed: ${error.message}`, 'error');
                testResults.menu.failed++;
            }
        }

        async function testPrayerNetworkButtons() {
            log('prayer-results', '🔍 Testing Prayer Network Buttons...', 'info');
            
            try {
                const response = await fetch('Qwen_html_20250810_ttxf0530d.html');
                if (!response.ok) throw new Error('Prayer network file not found');
                const html = await response.text();
                
                // Check navigation buttons
                const navButtons = ['hero-view-wall', 'nav-home-link', 'nav-wall-link', 'nav-about-link', 'nav-submit-btn'];
                navButtons.forEach(buttonId => {
                    if (html.includes(`id="${buttonId}"`)) {
                        log('prayer-results', `✅ ${buttonId} button exists`, 'success');
                        testResults.prayer.passed++;
                    } else {
                        log('prayer-results', `❌ ${buttonId} button missing`, 'error');
                        testResults.prayer.failed++;
                    }
                });
                
                // Check form submission
                if (html.includes('id="prayerForm"')) {
                    log('prayer-results', '✅ Prayer form exists', 'success');
                    testResults.prayer.passed++;
                } else {
                    log('prayer-results', '❌ Prayer form missing', 'error');
                    testResults.prayer.failed++;
                }
                
                // Check event listeners
                const listeners = ['addEventListener(\'click\'', 'form.addEventListener(\'submit\''];
                listeners.forEach(listener => {
                    if (html.includes(listener)) {
                        log('prayer-results', `✅ Event listener found: ${listener}`, 'success');
                        testResults.prayer.passed++;
                    } else {
                        log('prayer-results', `❌ Event listener missing: ${listener}`, 'error');
                        testResults.prayer.failed++;
                    }
                });
                
                // Check modal buttons
                if (html.includes('id="settings-save"') && html.includes('id="settings-close"')) {
                    log('prayer-results', '✅ Modal buttons exist', 'success');
                    testResults.prayer.passed++;
                } else {
                    log('prayer-results', '❌ Modal buttons missing', 'error');
                    testResults.prayer.failed++;
                }
                
            } catch (error) {
                log('prayer-results', `❌ Prayer network test failed: ${error.message}`, 'error');
                testResults.prayer.failed++;
            }
        }

        async function testMainGameButtons() {
            log('game-results', '🔍 Testing Main Game Buttons...', 'info');
            
            try {
                const response = await fetch('script.js');
                if (!response.ok) throw new Error('script.js not found');
                const js = await response.text();
                
                // Check button elements exist
                const response2 = await fetch('index.html');
                const html = await response2.text();
                
                // Check main buttons
                const mainButtons = ['solo', 'teams'];
                mainButtons.forEach(buttonId => {
                    if (html.includes(`id="${buttonId}"`)) {
                        log('game-results', `✅ ${buttonId} button exists`, 'success');
                        testResults.game.passed++;
                    } else {
                        log('game-results', `❌ ${buttonId} button missing`, 'error');
                        testResults.game.failed++;
                    }
                });
                
                // Check button handlers
                const handlers = ['soloBtn.onclick', 'teamsBtn.onclick', 'nextBtn.onclick', 'playAgainBtn.onclick'];
                handlers.forEach(handler => {
                    if (js.includes(handler)) {
                        log('game-results', `✅ Button handler found: ${handler}`, 'success');
                        testResults.game.passed++;
                    } else {
                        log('game-results', `❌ Button handler missing: ${handler}`, 'error');
                        testResults.game.failed++;
                    }
                });
                
                // Check game tools
                const tools = ['hintBtn', 'takeawayBtn', 'freezeTimeBtn'];
                tools.forEach(tool => {
                    if (js.includes(`${tool}.onclick`)) {
                        log('game-results', `✅ Game tool handler found: ${tool}`, 'success');
                        testResults.game.passed++;
                    } else {
                        log('game-results', `❌ Game tool handler missing: ${tool}`, 'error');
                        testResults.game.failed++;
                    }
                });
                
            } catch (error) {
                log('game-results', `❌ Main game test failed: ${error.message}`, 'error');
                testResults.game.failed++;
            }
        }

        async function testAuthButtons() {
            log('auth-results', '🔍 Testing Authentication Buttons...', 'info');
            
            try {
                // Check auth-leaderboard.js
                const response = await fetch('auth-leaderboard.js');
                if (!response.ok) throw new Error('auth-leaderboard.js not found');
                const js = await response.text();
                
                // Check AuthManager methods
                const methods = ['signIn', 'signOut', 'init', 'subscribe'];
                methods.forEach(method => {
                    if (js.includes(`${method},`) || js.includes(`${method}:`)) {
                        log('auth-results', `✅ AuthManager method found: ${method}`, 'success');
                        testResults.auth.passed++;
                    } else {
                        log('auth-results', `❌ AuthManager method missing: ${method}`, 'error');
                        testResults.auth.failed++;
                    }
                });
                
                // Check menu.html for auth buttons
                const response2 = await fetch('menu.html');
                const html = await response2.text();
                
                if (html.includes('function signInWithGoogle()')) {
                    log('auth-results', '✅ signInWithGoogle function exists', 'success');
                    testResults.auth.passed++;
                } else {
                    log('auth-results', '❌ signInWithGoogle function missing', 'error');
                    testResults.auth.failed++;
                }
                
                if (html.includes('function signOut()')) {
                    log('auth-results', '✅ signOut function exists', 'success');
                    testResults.auth.passed++;
                } else {
                    log('auth-results', '❌ signOut function missing', 'error');
                    testResults.auth.failed++;
                }
                
                // Check Firebase config
                if (html.includes('firebase-config.js')) {
                    log('auth-results', '✅ Firebase config included', 'success');
                    testResults.auth.passed++;
                } else {
                    log('auth-results', '❌ Firebase config missing', 'error');
                    testResults.auth.failed++;
                }
                
            } catch (error) {
                log('auth-results', `❌ Auth test failed: ${error.message}`, 'error');
                testResults.auth.failed++;
            }
        }

        // Initialize summary on load
        window.addEventListener('load', () => {
            updateSummary();
        });
    </script>
</body>
</html>
