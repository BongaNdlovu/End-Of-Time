<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Auth Test - End of Time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .status {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { background: #2e7d32; }
        .error { background: #c62828; }
        .warning { background: #f57c00; }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #357ae8; }
        button:disabled { background: #666; cursor: not-allowed; }
        .log {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .user-info {
            background: linear-gradient(145deg, #2a2a2a, #3a3a3a);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
            border: 2px solid rgba(139,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>🌐 Domain Authentication Test</h1>
    <p>Testing sign-in for domain: <strong>endoftime7.com</strong></p>
    
    <div class="status" id="domain-status">
        <h3>Domain Information</h3>
        <p>Current URL: <span id="current-url"></span></p>
        <p>Protocol: <span id="protocol"></span></p>
        <p>Hostname: <span id="hostname"></span></p>
        <p>HTTPS: <span id="is-https"></span></p>
        <p>Firebase Auth Domain: <span id="firebase-domain"></span></p>
    </div>

    <button id="test-firebase-btn">Test Firebase Config</button>
    <button id="popup-signin-btn" disabled>Test Popup Sign-In</button>
    <button id="redirect-signin-btn" disabled>Test Redirect Sign-In</button>
    <button id="signout-btn" style="display:none; background:#f44336;">Sign Out</button>

    <div id="user-info"></div>

    <h3>Debug Log:</h3>
    <div class="log" id="log"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const logDiv = document.getElementById('log');
        const userInfoDiv = document.getElementById('user-info');
        const popupBtn = document.getElementById('popup-signin-btn');
        const redirectBtn = document.getElementById('redirect-signin-btn');
        const signoutBtn = document.getElementById('signout-btn');
        const testConfigBtn = document.getElementById('test-firebase-btn');

        // Display domain information
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('hostname').textContent = window.location.hostname;
        document.getElementById('is-https').textContent = window.location.protocol === 'https:' ? '✅ Yes' : '❌ No';
        document.getElementById('firebase-domain').textContent = firebaseConfig?.authDomain || 'Not loaded';

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.style.color = type === 'error' ? '#f44336' : 
                              type === 'warning' ? '#ff9800' : 
                              type === 'success' ? '#4caf50' : '#2196f3';
            div.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function showError(message, error) {
            log(message, 'error');
            if (error && error.stack) {
                log(`Stack: ${error.stack}`, 'error');
            }
        }

        function updateDomainStatus() {
            const statusDiv = document.getElementById('domain-status');
            const isHttps = window.location.protocol === 'https:';
            const isCorrectDomain = window.location.hostname.includes('endoftime7.com');
            
            if (!isHttps) {
                statusDiv.className = 'status error';
                log('❌ WARNING: Not on HTTPS! This may cause authentication issues.', 'error');
            } else if (!isCorrectDomain) {
                statusDiv.className = 'status warning';
                log('⚠️ Not on endoftime7.com domain', 'warning');
            } else {
                statusDiv.className = 'status success';
                log('✅ Correct domain and protocol', 'success');
            }
        }

        function testFirebaseConfig() {
            log('🔄 Testing Firebase configuration...', 'info');
            
            if (typeof firebase === 'undefined') {
                showError('❌ Firebase SDK not loaded');
                return;
            }
            
            if (typeof firebaseConfig === 'undefined') {
                showError('❌ Firebase config not found');
                return;
            }
            
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                    log('✅ Firebase app initialized', 'success');
                } else {
                    log('✅ Firebase app already initialized', 'success');
                }
                
                const auth = firebase.auth();
                log('✅ Firebase auth service available', 'success');
                
                log(`🌐 Auth domain: ${firebaseConfig.authDomain}`, 'info');
                log(`🌐 Current domain: ${window.location.hostname}`, 'info');
                
                if (firebaseConfig.authDomain !== window.location.hostname) {
                    log(`⚠️ Auth domain mismatch! This may cause issues.`, 'warning');
                    log(`   Expected: ${window.location.hostname}`, 'warning');
                    log(`   Configured: ${firebaseConfig.authDomain}`, 'warning');
                }
                
                // Enable sign-in buttons
                popupBtn.disabled = false;
                redirectBtn.disabled = false;
                
            } catch (error) {
                showError('❌ Firebase config test failed', error);
            }
        }

        function setupAuthStateObserver() {
            const auth = firebase.auth();
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    log(`✅ User signed in: ${user.displayName} (${user.email})`, 'success');
                    log(`🆔 UID: ${user.uid}`, 'info');
                    
                    userInfoDiv.innerHTML = `
                        <div class="user-info">
                            <img src="${user.photoURL}" style="width:80px; height:80px; border-radius:50%; margin-bottom:15px;">
                           <h2 style="margin:0 0 10px 0;">${user.displayName}</h2>
                            <p style="color:#aaa; margin:5px 0;">${user.email}</p>
                            <p style="color:#4caf50;">✅ Successfully Signed In!</p>
                        </div>
                    `;
                    
                    popupBtn.style.display = 'none';
                    redirectBtn.style.display = 'none';
                    signoutBtn.style.display = 'inline-block';
                } else {
                    log('ℹ️ No user signed in', 'info');
                    userInfoDiv.innerHTML = '<p style="color:#aaa; text-align:center;">Not signed in</p>';
                    
                    popupBtn.style.display = 'inline-block';
                    redirectBtn.style.display = 'inline-block';
                    signoutBtn.style.display = 'none';
                    
                    // Check for redirect result
                    auth.getRedirectResult()
                        .then(result => {
                            if (result && result.user) {
                                log(`✅ Redirect sign-in successful: ${result.user.displayName}`, 'success');
                            } else {
                                log('ℹ️ No pending redirect result', 'info');
                            }
                        })
                        .catch(error => {
                            showError(`❌ Redirect result error: ${error.code}`, error);
                        });
                }
            });
        }

        // Test Firebase config
        testConfigBtn.onclick = testFirebaseConfig;

        // Popup sign-in
        popupBtn.onclick = async () => {
            log('🔐 Starting popup sign-in...', 'info');
            const auth = firebase.auth();
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            provider.addScope('email');
            provider.addScope('profile');

            try {
                log('📱 Opening popup window...', 'info');
                const result = await auth.signInWithPopup(provider);
                log(`✅ Popup sign-in successful: ${result.user.displayName}`, 'success');
            } catch (error) {
                log(`❌ Popup sign-in failed: ${error.code}`, 'error');
                log(`Error message: ${error.message}`, 'error');

                if (error.code === 'auth/popup-blocked') {
                    log('⚠️ Popup was blocked by browser!', 'warning');
                    log('💡 Try allowing popups or use redirect method', 'info');
                } else if (error.code === 'auth/unauthorized-domain') {
                    log('❌ Current domain not authorized in Firebase!', 'error');
                    log('💡 Add this domain to Firebase Auth authorized domains', 'error');
                    log('🌐 Go to: Firebase Console → Authentication → Settings → Authorized domains', 'info');
                } else if (error.code === 'auth/cancelled-popup-request') {
                    log('⚠️ Popup request was cancelled', 'warning');
                } else {
                    showError('❌ Unexpected error during popup sign-in', error);
                }
            }
        };

        // Redirect sign-in
        redirectBtn.onclick = async () => {
            log('🔐 Starting redirect sign-in...', 'info');
            const auth = firebase.auth();
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                log('🔄 Redirecting to Google...', 'info');
                await auth.signInWithRedirect(provider);
            } catch (error) {
                showError(`❌ Redirect sign-in failed: ${error.code}`, error);
            }
        };

        // Sign out
        signoutBtn.onclick = async () => {
            try {
                await firebase.auth().signOut();
                log('✅ Signed out successfully', 'success');
            } catch (error) {
                showError('❌ Sign out failed', error);
            }
        };

        // Initialize
        updateDomainStatus();
        testFirebaseConfig();
        setupAuthStateObserver();
    </script>
</body>
</html>
