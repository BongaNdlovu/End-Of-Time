<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug - End of Time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover { background: #357ae8; }
        .log {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .info { color: #2196f3; }
        .debug-info {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Google Sign-In Debug</h1>
    
    <div class="debug-info">
        <h3>Environment Info:</h3>
        <p>Protocol: <span id="protocol"></span></p>
        <p>Host: <span id="host"></span></p>
        <p>HTTPS: <span id="is-https"></span></p>
        <p>User Agent: <span id="user-agent"></span></p>
    </div>

    <button id="test-config-btn">Test Firebase Config</button>
    <button id="popup-signin-btn">Test Popup Sign-In</button>
    <button id="redirect-signin-btn">Test Redirect Sign-In</button>
    <button id="signout-btn" style="display:none; background:#f44336;">Sign Out</button>

    <div id="user-info"></div>

    <h3>Debug Log:</h3>
    <div class="log" id="log"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const logDiv = document.getElementById('log');
        const userInfoDiv = document.getElementById('user-info');
        const popupBtn = document.getElementById('popup-signin-btn');
        const redirectBtn = document.getElementById('redirect-signin-btn');
        const signoutBtn = document.getElementById('signout-btn');
        const testConfigBtn = document.getElementById('test-config-btn');

        // Environment info
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('host').textContent = window.location.host;
        document.getElementById('is-https').textContent = window.location.protocol === 'https:' ? 'Yes' : 'No';
        document.getElementById('user-agent').textContent = navigator.userAgent;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        function testFirebaseConfig() {
            log('🔄 Testing Firebase configuration...', 'info');
            
            if (typeof firebase === 'undefined') {
                log('❌ Firebase SDK not loaded', 'error');
                return;
            }
            
            if (typeof firebaseConfig === 'undefined') {
                log('❌ Firebase config not found', 'error');
                return;
            }
            
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                    log('✅ Firebase app initialized', 'success');
                } else {
                    log('✅ Firebase app already initialized', 'success');
                }
                
                const auth = firebase.auth();
                log('✅ Firebase auth service available', 'success');
                
                // Test domain authorization
                log(`🌐 Auth domain: ${firebaseConfig.authDomain}`, 'info');
                log(`🌐 Current domain: ${window.location.hostname}`, 'info');
                
            } catch (error) {
                log(`❌ Firebase config test failed: ${error.message}`, 'error');
            }
        }

        // Auth state observer
        function setupAuthStateObserver() {
            const auth = firebase.auth();
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    log(`✅ User signed in: ${user.displayName} (${user.email})`, 'success');
                    log(`🆔 UID: ${user.uid}`, 'info');
                    userInfoDiv.innerHTML = `
                        <div style="background:#2a2a2a; padding:15px; border-radius:5px; margin-top:20px;">
                            <img src="${user.photoURL}" style="width:64px; height:64px; border-radius:50%; vertical-align:middle; margin-right:15px;">
                            <div style="display:inline-block;">
                                <div style="font-size:20px; font-weight:bold;">${user.displayName}</div>
                                <div style="color:#aaa;">${user.email}</div>
                                <div style="color:#4caf50; margin-top:5px;">✅ Signed In</div>
                            </div>
                        </div>
                    `;
                    popupBtn.style.display = 'none';
                    redirectBtn.style.display = 'none';
                    signoutBtn.style.display = 'inline-block';
                } else {
                    log('ℹ️ No user signed in', 'info');
                    userInfoDiv.innerHTML = '<p style="color:#aaa;">Not signed in</p>';
                    popupBtn.style.display = 'inline-block';
                    redirectBtn.style.display = 'inline-block';
                    signoutBtn.style.display = 'none';
                    
                    // Check for redirect result
                    auth.getRedirectResult()
                        .then(result => {
                            if (result && result.user) {
                                log(`✅ Redirect sign-in successful: ${result.user.displayName}`, 'success');
                            } else {
                                log('ℹ️ No redirect result', 'info');
                            }
                        })
                        .catch(error => {
                            log(`❌ Redirect result error: ${error.code} - ${error.message}`, 'error');
                        });
                }
            });
        }

        // Test Firebase config
        testConfigBtn.onclick = testFirebaseConfig;

        // Popup sign-in
        popupBtn.onclick = async () => {
            log('🔐 Starting popup sign-in...', 'info');
            const auth = firebase.auth();
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                log('📱 Opening popup window...', 'info');
                const result = await auth.signInWithPopup(provider);
                log(`✅ Popup sign-in successful: ${result.user.displayName}`, 'success');
            } catch (error) {
                log(`❌ Popup sign-in failed`, 'error');
                log(`Error code: ${error.code}`, 'error');
                log(`Error message: ${error.message}`, 'error');

                if (error.code === 'auth/popup-blocked') {
                    log('⚠️ Popup was blocked by browser!', 'warning');
                    log('💡 Try allowing popups or use redirect method', 'info');
                } else if (error.code === 'auth/unauthorized-domain') {
                    log('⚠️ Current domain not authorized in Firebase!', 'warning');
                    log('💡 Add this domain to Firebase Auth authorized domains', 'info');
                } else if (error.code === 'auth/cancelled-popup-request') {
                    log('⚠️ Popup request was cancelled', 'warning');
                    log('💡 Try again without rapid clicking', 'info');
                }
            }
        };

        // Redirect sign-in
        redirectBtn.onclick = async () => {
            log('🔐 Starting redirect sign-in...', 'info');
            const auth = firebase.auth();
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                log('🔄 Redirecting to Google...', 'info');
                await auth.signInWithRedirect(provider);
            } catch (error) {
                log(`❌ Redirect sign-in failed: ${error.code}`, 'error');
                log(`Error message: ${error.message}`, 'error');
            }
        };

        // Sign out
        signoutBtn.onclick = async () => {
            try {
                await firebase.auth().signOut();
                log('✅ Signed out successfully', 'success');
            } catch (error) {
                log(`❌ Sign out failed: ${error.message}`, 'error');
            }
        };

        // Initialize
        testFirebaseConfig();
        setupAuthStateObserver();
    </script>
</body>
</html>
