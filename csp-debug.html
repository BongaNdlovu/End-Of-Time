<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSP Debug - End of Time Academy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .debug-section { background: #2a2a2a; padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 4px solid #e74c3c; }
        .success { border-left-color: #27ae60; }
        .warning { border-left-color: #f39c12; }
        .error { border-left-color: #e74c3c; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .test-button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .test-button:hover { background: #2980b9; }
        .result { margin-top: 10px; padding: 10px; background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>CSP Debug Tool - End of Time Academy</h1>
    
    <div class="debug-section">
        <h2>🔍 Current CSP Information</h2>
        <div id="current-csp"></div>
    </div>

    <div class="debug-section">
        <h2>🌐 Browser Information</h2>
        <div id="browser-info"></div>
    </div>

    <div class="debug-section">
        <h2>📡 Resource Loading Tests</h2>
        <button class="test-button" onclick="testFontLoading()">Test Font Loading</button>
        <button class="test-button" onclick="testScriptLoading()">Test Script Loading</button>
        <button class="test-button" onclick="testBlobCreation()">Test Blob Creation</button>
        <button class="test-button" onclick="testInlineStyles()">Test Inline Styles</button>
        <div id="test-results"></div>
    </div>

    <div class="debug-section">
        <h2>📋 Console Errors</h2>
        <p>Check the browser console for CSP violations. This page will help identify specific issues.</p>
    </div>

    <div class="debug-section">
        <h2>🔗 URL Analysis</h2>
        <div id="url-analysis"></div>
    </div>

    <script>
        // Current URL and CSP Analysis
        document.getElementById('current-csp').innerHTML = `
            <strong>Current URL:</strong> ${window.location.href}<br>
            <strong>Page Protocol:</strong> ${window.location.protocol}<br>
            <strong>Page Host:</strong> ${window.location.host}<br>
            <strong>Page Origin:</strong> ${window.location.origin}
        `;

        // Browser Information
        document.getElementById('browser-info').innerHTML = `
            <strong>User Agent:</strong> ${navigator.userAgent}<br>
            <strong>Language:</strong> ${navigator.language}<br>
            <strong>Platform:</strong> ${navigator.platform}<br>
            <strong>Cookies Enabled:</strong> ${navigator.cookieEnabled}
        `;

        // URL Analysis
        const currentUrl = window.location.href;
        const urlParts = {
            protocol: window.location.protocol,
            hostname: window.location.hostname,
            port: window.location.port,
            pathname: window.location.pathname,
            search: window.location.search,
            hash: window.location.hash
        };

        document.getElementById('url-analysis').innerHTML = `
            <pre>${JSON.stringify(urlParts, null, 2)}</pre>
        `;

        // Test Functions
        function logResult(test, status, message) {
            const resultDiv = document.getElementById('test-results');
            const resultClass = status === 'success' ? 'success' : status === 'error' ? 'error' : 'warning';
            resultDiv.innerHTML += `
                <div class="result ${resultClass}">
                    <strong>${test}:</strong> ${status.toUpperCase()} - ${message}
                </div>
            `;
        }

        function testFontLoading() {
            try {
                // Test loading Google Fonts
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap';
                link.onload = () => logResult('Font Loading', 'success', 'Google Fonts CSS loaded successfully');
                link.onerror = () => logResult('Font Loading', 'error', 'Failed to load Google Fonts CSS');
                document.head.appendChild(link);

                // Test loading a font file directly
                const fontTest = new FontFace('TestFont', 'url(https://fonts.gstatic.com/s/montserrat/v15/JTUSjIg1_i6t8kCHKm459Wlhyw.woff2)');
                fontTest.load().then(() => {
                    logResult('Direct Font Load', 'success', 'Font file loaded successfully');
                }).catch(err => {
                    logResult('Direct Font Load', 'error', `Failed to load font: ${err.message}`);
                });
            } catch (err) {
                logResult('Font Loading', 'error', `Exception: ${err.message}`);
            }
        }

        function testScriptLoading() {
            try {
                // Test external script loading
                const script = document.createElement('script');
                script.src = 'https://cdn.tailwindcss.com';
                script.onload = () => logResult('External Script', 'success', 'External script loaded successfully');
                script.onerror = () => logResult('External Script', 'error', 'Failed to load external script');
                document.head.appendChild(script);
            } catch (err) {
                logResult('Script Loading', 'error', `Exception: ${err.message}`);
            }
        }

        function testBlobCreation() {
            try {
                const scriptContent = 'console.log("Blob script loaded successfully");';
                const blob = new Blob([scriptContent], { type: 'text/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                
                const script = document.createElement('script');
                script.src = blobUrl;
                script.onload = () => logResult('Blob Script', 'success', 'Blob script created and executed');
                script.onerror = () => logResult('Blob Script', 'error', 'Failed to load blob script');
                document.head.appendChild(script);
                
                setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            } catch (err) {
                logResult('Blob Creation', 'error', `Exception: ${err.message}`);
            }
        }

        function testInlineStyles() {
            try {
                const div = document.createElement('div');
                div.style.color = 'red';
                div.style.background = 'blue';
                div.innerHTML = 'Test Inline Styles';
                document.body.appendChild(div);
                logResult('Inline Styles', 'success', 'Inline styles applied successfully');
            } catch (err) {
                logResult('Inline Styles', 'error', `Exception: ${err.message}`);
            }
        }

        // Monitor CSP violations
        window.addEventListener('securitypolicyviolation', (event) => {
            console.error('CSP Violation:', {
                violatedDirective: event.violatedDirective,
                originalPolicy: event.originalPolicy,
                blockedURI: event.blockedURI,
                sourceFile: event.sourceFile,
                lineNumber: event.lineNumber,
                columnNumber: event.columnNumber
            });
        });

        // Log page load events
        window.addEventListener('load', () => {
            console.log('Page fully loaded');
            document.getElementById('current-csp').innerHTML += '<br><strong>Status:</strong> Page loaded successfully';
        });

        // Check for CSP headers
        fetch(window.location.href, { method: 'HEAD' })
            .then(response => {
                const cspHeader = response.headers.get('Content-Security-Policy');
                if (cspHeader) {
                    document.getElementById('current-csp').innerHTML += `<br><strong>CSP Header:</strong><br><pre>${cspHeader}</pre>`;
                } else {
                    document.getElementById('current-csp').innerHTML += '<br><strong>CSP Header:</strong> None found in response headers';
                }
            })
            .catch(err => {
                console.error('Error fetching headers:', err);
            });

        console.log('CSP Debug Page Initialized - Check console for detailed information');
    </script>
</body>
</html>
