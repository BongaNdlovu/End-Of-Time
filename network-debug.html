<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Debug - End of Time Academy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .debug-section { background: #2a2a2a; padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 4px solid #3498db; }
        .status-200 { border-left-color: #27ae60; }
        .status-404 { border-left-color: #e74c3c; }
        .status-other { border-left-color: #f39c12; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #2980b9; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .resource-item { margin: 10px 0; padding: 10px; background: #333; border-radius: 4px; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .warning { color: #f39c12; }
    </style>
</head>
<body>
    <h1>🔍 Network Debug Tool</h1>
    <p>This page will test various resource loading scenarios to identify network and CSP issues.</p>
    
    <div class="debug-section">
        <h2>🚀 Resource Loading Tests</h2>
        <button onclick="testAllResources()">Test All Resources</button>
        <button onclick="testImages()">Test Images</button>
        <button onclick="testVideos()">Test Videos</button>
        <button onclick="testAudio()">Test Audio</button>
        <button onclick="testFonts()">Test Fonts</button>
        <button onclick="testScripts()">Test Scripts</button>
        <button onclick="testStylesheets()">Test Stylesheets</button>
        <div id="results"></div>
    </div>

    <div class="debug-section">
        <h2>🌐 Academy-Specific Tests</h2>
        <button onclick="testAcademyFiles()">Test Academy Files</button>
        <button onclick="testIndex2Page()">Test index2.html</button>
        <button onclick="testAcademyResources()">Test Academy Resources</button>
        <div id="academy-results"></div>
    </div>

    <div class="debug-section">
        <h2>📡 Network Analysis</h2>
        <div id="network-analysis"></div>
    </div>

    <script>
        let resultsContainer = document.getElementById('results');
        let academyResultsContainer = document.getElementById('academy-results');
        let networkContainer = document.getElementById('network-analysis');

        function logResult(type, url, status, message = '', details = {}) {
            const div = document.createElement('div');
            div.className = `resource-item status-${status}`;
            
            let statusIcon = '❓';
            if (status === 200) statusIcon = '✅';
            else if (status === 404) statusIcon = '❌';
            else if (status >= 400) statusIcon = '⚠️';
            
            div.innerHTML = `
                <h3>${statusIcon} ${type}: ${status}</h3>
                <p><strong>URL:</strong> ${url}</p>
                ${message ? `<p><strong>Message:</strong> ${message}</p>` : ''}
                ${Object.keys(details).length > 0 ? `<pre>${JSON.stringify(details, null, 2)}</pre>` : ''}
            `;
            
            return div;
        }

        async function testResource(url, type) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                const contentType = response.headers.get('content-type');
                const contentLength = response.headers.get('content-length');
                
                const result = logResult(type, url, response.status, response.statusText, {
                    contentType,
                    contentLength,
                    headers: Object.fromEntries(response.headers.entries())
                });
                
                return { element: result, status: response.status };
            } catch (error) {
                const result = logResult(type, url, 'ERROR', error.message);
                return { element: result, status: 'ERROR' };
            }
        }

        async function testImages() {
            const images = [
                '../End of Time Icon.png',
                '../Fear God.png',
                '1.svg',
                '../Genesis Y.mp4'
            ];
            
            for (const img of images) {
                const result = await testResource(img, 'Image/Video');
                resultsContainer.appendChild(result.element);
            }
        }

        async function testVideos() {
            const videos = [
                '../Genesis Y.mp4',
                '../Genesis X.mp4',
                '../Background 1.mp4'
            ];
            
            for (const video of videos) {
                const result = await testResource(video, 'Video');
                resultsContainer.appendChild(result.element);
            }
        }

        async function testAudio() {
            const audioFiles = [
                '../correct_answer_1.wav',
                '../Incorrect 1.wav',
                '../soundtrack 2.mp3'
            ];
            
            for (const audio of audioFiles) {
                const result = await testResource(audio, 'Audio');
                resultsContainer.appendChild(result.element);
            }
        }

        async function testFonts() {
            const fonts = [
                'https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap',
                'https://fonts.gstatic.com/s/montserrat/v15/JTUSjIg1_i6t8kCHKm459Wlhyw.woff2'
            ];
            
            for (const font of fonts) {
                const result = await testResource(font, 'Font');
                resultsContainer.appendChild(result.element);
            }
        }

        async function testScripts() {
            const scripts = [
                'presentations.js',
                '../script.js',
                'https://cdn.tailwindcss.com'
            ];
            
            for (const script of scripts) {
                const result = await testResource(script, 'Script');
                resultsContainer.appendChild(result.element);
            }
        }

        async function testStylesheets() {
            const stylesheets = [
                'presentations-styles.css',
                '../styles.css',
                'https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap'
            ];
            
            for (const stylesheet of stylesheets) {
                const result = await testResource(stylesheet, 'Stylesheet');
                resultsContainer.appendChild(result.element);
            }
        }

        async function testAcademyFiles() {
            const academyFiles = [
                'index2.html',
                'index1.html',
                'presentations.js',
                'presentations-styles.css'
            ];
            
            for (const file of academyFiles) {
                const result = await testResource(file, 'Academy File');
                academyResultsContainer.appendChild(result.element);
            }
        }

        async function testIndex2Page() {
            const urls = [
                './index2.html',
                'index2.html',
                '../academy/index2.html',
                'https://end-of-time-94cd3.web.app/academy/index2.html'
            ];
            
            for (const url of urls) {
                const result = await testResource(url, 'Index2 Test');
                academyResultsContainer.appendChild(result.element);
            }
        }

        async function testAcademyResources() {
            const resources = [
                '../Genesis Y.mp4',
                '../Fear God.png',
                'presentations.js',
                'presentations-styles.css'
            ];
            
            for (const resource of resources) {
                const result = await testResource(resource, 'Academy Resource');
                academyResultsContainer.appendChild(result.element);
            }
        }

        async function testAllResources() {
            resultsContainer.innerHTML = '';
            academyResultsContainer.innerHTML = '';
            
            await Promise.all([
                testImages(),
                testVideos(), 
                testAudio(),
                testFonts(),
                testScripts(),
                testStylesheets(),
                testAcademyFiles(),
                testIndex2Page(),
                testAcademyResources()
            ]);
        }

        // Network Analysis
        function analyzeNetwork() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            let analysis = `
                <h3>📡 Connection Information</h3>
                <p><strong>Online:</strong> ${navigator.onLine}</p>
            `;
            
            if (connection) {
                analysis += `
                    <p><strong>Effective Type:</strong> ${connection.effectiveType}</p>
                    <p><strong>Downlink:</strong> ${connection.downlink} Mbps</p>
                    <p><strong>RTT:</strong> ${connection.rtt} ms</p>
                `;
            }
            
            analysis += `
                <h3>📍 Location Information</h3>
                <p><strong>Current URL:</strong> ${window.location.href}</p>
                <p><strong>Protocol:</strong> ${window.location.protocol}</p>
                <p><strong>Host:</strong> ${window.location.host}</p>
                <p><strong>Origin:</strong> ${window.location.origin}</p>
                <p><strong>Pathname:</strong> ${window.location.pathname}</p>
            `;
            
            networkContainer.innerHTML = analysis;
        }

        // Monitor CSP violations
        window.addEventListener('securitypolicyviolation', (event) => {
            const violationDiv = document.createElement('div');
            violationDiv.className = 'resource-item status-404 error';
            violationDiv.innerHTML = `
                <h3>🚨 CSP Violation Detected</h3>
                <p><strong>Violated Directive:</strong> ${event.violatedDirective}</p>
                <p><strong>Blocked URI:</strong> ${event.blockedURI}</p>
                <p><strong>Source File:</strong> ${event.sourceFile || 'N/A'}</p>
                <p><strong>Line:</strong> ${event.lineNumber || 'N/A'}</p>
                <p><strong>Original Policy:</strong> <pre>${event.originalPolicy}</pre></p>
            `;
            
            resultsContainer.appendChild(violationDiv);
            console.error('CSP Violation:', event);
        });

        // Initialize
        window.addEventListener('load', () => {
            analyzeNetwork();
            console.log('Network Debug Page Initialized');
        });

        // Clear function
        function clearResults() {
            resultsContainer.innerHTML = '';
            academyResultsContainer.innerHTML = '';
        }

        // Add clear button
        document.querySelector('button').insertAdjacentHTML('afterend', ' <button onclick="clearResults()">Clear Results</button>');
    </script>
</body>
</html>
